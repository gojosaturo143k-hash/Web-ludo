<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎲 Ludo Game</title>

  <!-- CSS file -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    #game {
      margin-top: 20px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(10, 40px);
      gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }

    .cell {
      width: 40px;
      height: 40px;
      border: 1px solid #999;
      background: #fff;
      position: relative;
    }

    .token {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: red;
      position: absolute;
      top: 10px;
      left: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🎲 Ludo Multiplayer Game</h2>

  <div id="game">
    <h3 id="status">Waiting for players...</h3>

    <!-- 🧱 BOARD ADDED HERE -->
    <div id="board"></div>

    <button id="roll">🎲 Roll Dice</button>
  </div>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
