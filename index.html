<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎲 Ludo Game</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    #game {
      margin-top: 20px;
    }

    #board {
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(8, 40px);
      gap: 5px;
      justify-content: center;
    }

    .cell {
      width: 40px;
      height: 40px;
      background: white;
      border: 1px solid #ccc;
      position: relative;
    }

    .token {
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>🎲 Ludo Multiplayer Game</h2>

  <div id="game">
    <h3 id="status">Waiting for players...</h3>
    <button id="roll">🎲 Roll Dice</button>

    <!-- ✅ BOARD ADDED HERE -->
    <div id="board"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
